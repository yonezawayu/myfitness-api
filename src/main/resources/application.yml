debug: false
trace: false

spring:
  devtools:
    # Keep restart support available without DevTools' DEBUG-oriented logging defaults.
    add-properties: false

  mvc:
    # Prevent request parameters and headers (including Authorization) from being logged.
    log-request-details: false

  datasource:
    url: ${MYFITNESS_DB_URL}
    username: ${MYFITNESS_DB_USERNAME}
    password: ${MYFITNESS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # Existing environments must be baselined and migrated manually before this
  # is enabled. Keeping it disabled prevents an application start from changing
  # the database during the M3 migration preparation.
  flyway:
    enabled: false

server:
  # Do not let arbitrary Forwarded / X-Forwarded-For headers alter the socket peer.
  forward-headers-strategy: none
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: OFF

jwt:
  secret: ${MYFITNESS_JWT_SECRET}
  expiration-minutes: 60
  issuer: "myfitness-api"

myfitness:
  proxy:
    # Empty by default. Trust only dedicated proxy peers, never all private networks.
    # Keep server.forward-headers-strategy=none so the resolver sees the socket peer.
    trusted-cidrs: ${MYFITNESS_TRUSTED_PROXY_CIDRS:}
  auth-rate-limit:
    login-attempts: ${MYFITNESS_AUTH_LOGIN_ATTEMPTS:10}
    registration-attempts: ${MYFITNESS_AUTH_REGISTRATION_ATTEMPTS:5}
    window-seconds: ${MYFITNESS_AUTH_WINDOW_SECONDS:300}
    max-entries: ${MYFITNESS_AUTH_MAX_ENTRIES:10000}
  cors:
    allowed-origins: ${MYFITNESS_CORS_ALLOWED_ORIGINS:}
  features:
    records:
      enabled: false
    legacy-training:
      enabled: false
    meal-logs:
      enabled: false
    meal-items:
      enabled: false
    dashboard:
      enabled: false
    practice-memos:
      enabled: false
    foods:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: "prod | production"
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
