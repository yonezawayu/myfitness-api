spring:
  datasource:
    url: ${MYFITNESS_DB_URL}
    username: ${MYFITNESS_DB_USERNAME}
    password: ${MYFITNESS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  # Existing environments must be baselined and migrated manually before this
  # is enabled. Keeping it disabled prevents an application start from changing
  # the database during the M3 migration preparation.
  flyway:
    enabled: false

server:
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${MYFITNESS_JWT_SECRET}
  expiration-minutes: 60
  issuer: "myfitness-api"

myfitness:
  features:
    records:
      enabled: false
    legacy-training:
      enabled: false
    meal-logs:
      enabled: false
    meal-items:
      enabled: false
    dashboard:
      enabled: false
    practice-memos:
      enabled: false
    foods:
      enabled: false
