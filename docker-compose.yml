services:
  db:
    image: postgres:16
    container_name: myfitness-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: myfitness
      POSTGRES_USER: ${MYFITNESS_DB_USERNAME:?MYFITNESS_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${MYFITNESS_DB_PASSWORD:?MYFITNESS_DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
